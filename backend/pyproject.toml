[project]
name = "saarathi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nanduri Anirudh", email = "63451312+nandurianirudh@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "typer>=0.27.2",
    "tzdata>=2026.3",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
saarathi = "saarathi:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]
